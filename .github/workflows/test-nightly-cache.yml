# Temporary experiment for test/nightly-optimization; do not merge this workflow.
name: Nightly Cache Experiment

on:
  push:
    branches: [test/nightly-optimization]
    paths:
      - .github/workflows/test-nightly-cache.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-cache-experiment-${{ github.ref }}
  cancel-in-progress: false

# Each attempt gets isolated cache objects. The original main scope is buildkit;
# the fixed main scope and the nightly scope are both multigres. Prefixes keep
# the experiment from reading or overwriting other workflows' caches.
env:
  CACHE_PREFIX: nightly-experiment-${{ github.run_id }}-${{ github.run_attempt }}
  DOCKER_BUILD_SUMMARY: true

jobs:
  seed:
    name: Seed original and fixed cache scopes
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Read Go version
        id: goversion
        uses: ./.github/actions/go-version

      - name: Read commit date
        id: commitdate
        run: echo "date=$(git show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up fresh Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Start build timer
        run: echo "BUILD_STARTED=$(date +%s)" >> "$GITHUB_ENV"

      - name: Build once and seed both producer scopes
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: .
          file: ./Dockerfile
          build-args: |
            GO_VERSION=${{ steps.goversion.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
            COMMIT_DATE=${{ steps.commitdate.outputs.date }}
          platforms: linux/amd64,linux/arm64
          push: false
          outputs: type=oci,dest=${{ runner.temp }}/multigres.oci.tar
          tags: multigres-cache-test:local
          provenance: mode=max
          sbom: true
          cache-to: |
            type=gha,mode=max,scope=${{ env.CACHE_PREFIX }}-original-buildkit
            type=gha,mode=max,scope=${{ env.CACHE_PREFIX }}-fixed-multigres

      - name: Record seed duration
        run: |
          elapsed=$(( $(date +%s) - BUILD_STARTED ))
          echo "Seed build and two cache exports: ${elapsed}s" >> "$GITHUB_STEP_SUMMARY"

  compare:
    name: Nightly consumer (${{ matrix.case }})
    needs: seed
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        case: [original, fixed]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Read Go version
        id: goversion
        uses: ./.github/actions/go-version

      - name: Read commit date
        id: commitdate
        run: echo "date=$(git show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up fresh Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Start build timer
        run: echo "BUILD_STARTED=$(date +%s)" >> "$GITHUB_ENV"

      - name: Rebuild the same commit with nightly's scope
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: .
          file: ./Dockerfile
          build-args: |
            GO_VERSION=${{ steps.goversion.outputs.version }}
            GIT_COMMIT=${{ github.sha }}
            COMMIT_DATE=${{ steps.commitdate.outputs.date }}
          platforms: linux/amd64,linux/arm64
          push: false
          outputs: type=oci,dest=${{ runner.temp }}/multigres.oci.tar
          tags: multigres-cache-test:local
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ env.CACHE_PREFIX }}-${{ matrix.case }}-multigres
          cache-to: type=gha,mode=max,scope=${{ env.CACHE_PREFIX }}-${{ matrix.case }}-multigres

      - name: Record consumer duration
        env:
          CACHE_CASE: ${{ matrix.case }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          elapsed=$(( $(date +%s) - BUILD_STARTED ))
          {
            echo "### ${CACHE_CASE}"
            echo "- Commit: ${SOURCE_SHA}"
            echo "- Build, OCI export, and cache export: ${elapsed}s"
            echo "- Platforms: linux/amd64, linux/arm64"
            echo "- Cache scope: ${CACHE_PREFIX}-${CACHE_CASE}-multigres"
            echo "- Images were not published."
          } >> "$GITHUB_STEP_SUMMARY"
